<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Example</title>
</head>
<body>
    
    <!-- Unordered list -->
    <ul>
        <li>Clothes</li>
        <!-- Nested -->
         <ul>
            <li>Tshirs</li>
            <li>Jeans</li>
         </ul>
        <li>Technology</li>
         <ul>
            <li>Dell</li>
            <li>Hp</li>
            <li>Apple</li>
            <ul>
                <li>Iphone</li>
                <li>Ipad</li>
                <li>Macbook</li>
            </ul>
         </ul>
        <li>Shoes</li>
    </ul>

    <!-- Ordered Lists -->
     <ol reversed type="I">
        <li>CLothes</li>
        <li>Technology</li>
        <li>Shoes</li>
     </ol>


</body>
</html>
